<rect x="40" y="125" width="200" height="200" rx="8" fill="#ecfdf5" stroke="#334155" stroke-width="1.5"/>
<text x="140.0" y="147" text-anchor="middle" font-weight="700" font-size="14">Soil moisture ×6</text>
<text x="140.0" y="167" text-anchor="middle" font-size="12" fill="#475569">kapasitif, AOUT → GPIO</text>
<text x="140.0" y="183" text-anchor="middle" font-size="12" fill="#475569">VCC → 3V3 · GND → GND</text>
<text x="140.0" y="199" text-anchor="middle" font-size="12" fill="#475569">S1..S6 = 39,36,34,35,32,33</text>
