<text x="140.0" y="357" text-anchor="middle" font-weight="700" font-size="14">DHT11</text>
<text x="140.0" y="377" text-anchor="middle" font-size="12" fill="#475569">DATA → GPIO4</text>
<text x="140.0" y="393" text-anchor="middle" font-size="12" fill="#475569">VCC → 3V3 · GND → GND</text>
<polyline points="240,354 420,354" fill="none" stroke="#2563eb" stroke-width="2.2" />
<text x="310" y="346" font-size="11.5" fill="#2563eb" font-weight="600">DATA</text>
<rect x="790" y="170" width="250" height="95" rx="8" fill="#fef9c3" stroke="#334155" stroke-width="1.5"/>
<text x="915.0" y="192" text-anchor="middle" font-weight="700" font-size="14">LCD 20×4 + I2C backpack</text>
<text x="915.0" y="212" text-anchor="middle" font-size="12" fill="#475569">SDA → GPIO21 · SCL → GPIO22</text>
<text x="915.0" y="228" text-anchor="middle" font-size="12" fill="#475569">VCC → 5V · GND → GND</text>
<text x="915.0" y="244" text-anchor="middle" font-size="12" fill="#475569">alamat 0x27 (atau 0x3F)</text>
<polyline points="680,204 790,204" fill="none" stroke="#2563eb" stroke-width="2.2" />
<text x="720" y="198" font-size="11.5" fill="#2563eb" font-weight="600">SDA</text>
<polyline points="680,234 790,234" fill="none" stroke="#7c3aed" stroke-width="2.2" />
<text x="720" y="228" font-size="11.5" fill="#7c3aed" font-weight="600">SCL</text>
<rect x="790" y="95" width="250" height="60" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="915.0" y="117" text-anchor="middle" font-weight="700" font-size="14">Relay 1 ch (koil 5 V)</text>
<text x="915.0" y="137" text-anchor="middle" font-size="12" fill="#475569">IN ← GPIO27 · VCC 5V · GND</text>
<polyline points="680,154 790,125" fill="none" stroke="#2563eb" stroke-width="2.2" />
<text x="715" y="134" font-size="11.5" fill="#2563eb" font-weight="600">IN</text>
<rect x="790" y="330" width="250" height="75" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="915.0" y="352" text-anchor="middle" font-weight="700" font-size="14">Pompa mini 5 V DC</text>
<text x="915.0" y="372" text-anchor="middle" font-size="12" fill="#475569">(+) ← relay NO · (−) → GND adaptor</text>
<text x="915.0" y="388" text-anchor="middle" font-size="12" fill="#475569">dioda 1N4007 paralel pompa (pita ↔ +)</text>
<rect x="790" y="450" width="250" height="70" rx="8" fill="#fee2e2" stroke="#334155" stroke-width="1.5"/>
<text x="915.0" y="472" text-anchor="middle" font-weight="700" font-size="14">Adaptor 5 V DC 3 A</text>
<text x="915.0" y="492" text-anchor="middle" font-size="12" fill="#475569">(+) 5 V · (−) GND</text>

<polyline points="1040,485 1070,485 1070,125 1040,125" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="1074" y="300" font-size="11.5" fill="#dc2626" font-weight="600">5V</text>
<polyline points="680,304 740,304 740,485 790,485" fill="none" stroke="#dc2626" stroke-width="2.2" />
<text x="696" y="296" font-size="11.5" fill="#dc2626" font-weight="600">5V → VIN</text>
<polyline points="680,354 740,354" fill="none" stroke="#ea580c" stroke-width="2.2" />
<text x="684" y="346" font-size="11.5" fill="#ea580c" font-weight="600">3V3 → sensor</text>
<polyline points="680,424 760,424 760,500 790,500" fill="none" stroke="#111" stroke-width="2.2" />
<text x="700" y="440" font-size="11.5" fill="#111" font-weight="600">GND bersama</text>
<text x="40" y="560" font-size="13" font-weight="700">Jalur daya pompa:</text>
<text x="40" y="580" font-size="12">Adaptor 5 V (+) → COM relay → NO relay → Pompa (+) ; Pompa (−) → GND adaptor. Relay hanya memutus jalur (+) pompa.</text>
<text x="40" y="605" font-size="13" font-weight="700">Penting:</text>
<text x="52" y="627" font-size="12">• Semua GND (adaptor, ESP32, relay, LCD, sensor, pompa) disatukan.</text>
<text x="52" y="646" font-size="12">• Sensor tanah dan DHT11 diberi 3V3 (bukan 5 V) agar keluaran ADC tidak melebihi 3.3 V.</text>
<text x="52" y="665" font-size="12">• Jangan colok USB-C dan VIN 5 V bersamaan; saat flash lepas VIN atau pakai USB saja.</text>
<text x="52" y="684" font-size="12">• Tambahkan kapasitor 470 µF di rail 5 V dekat pompa bila ESP32 sering reset saat pompa menyala.</text>
</svg>