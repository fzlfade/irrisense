[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = spiffs
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^7.2.0

; ---- Env uji bangku: tanpa Wi-Fi/MQTT/SPIFFS, jadi tidak butuh src/secrets.h ----

; 1) Cek wiring: pindai I2C, LCD, relay, DHT11, ADC mentah. LEPAS POMPA saat tes ini!
[env:bringup]
extends = env:esp32dev
build_flags = -DBRINGUP
build_src_filter = +<*> -<net.cpp> -<storage_spiffs.cpp>

; 2) Kalibrasi sensor tanah lewat Serial Monitor (perintah d / w / p)
[env:esp32dev_cal]
extends = env:esp32dev
build_flags = -DCALIBRATION_MODE
build_src_filter = +<*> -<net.cpp> -<storage_spiffs.cpp>

; 3) Firmware utama tanpa jaringan: sensor + histeresis 60/80 + relay + LCD + Serial
[env:bench]
extends = env:esp32dev
build_flags = -DSTANDALONE
build_src_filter = +<*> -<net.cpp> -<storage_spiffs.cpp>
